# =============================================================================
# CloudBalancer's own error pages. Included in every server block that serves
# HTTP, generated ones too.
#
# These apply only to errors Nginx produces itself: a backend it cannot reach
# (502/504), a rate limit, a body over client_max_body_size, a bare
# `return 404`. A backend's own error responses pass through untouched --
# proxy_intercept_errors is off on every proxied route, and a customer's
# application should not have its pages replaced by ours. A `return` that
# carries a body, like the JSON answers elsewhere, is not affected either.
#
# A location that sets any error_page of its own (the panel's /api/) inherits
# none of these, which is what keeps Django's JSON errors JSON.
#
# The pages ship in the image, alongside this file. Requires the image built
# from the same commit as the config -- see the Dockerfile.
# =============================================================================

error_page 400 /.cloudbalancer/errors/400.html;
error_page 403 /.cloudbalancer/errors/403.html;
error_page 404 /.cloudbalancer/errors/404.html;
error_page 405 /.cloudbalancer/errors/405.html;
error_page 408 /.cloudbalancer/errors/408.html;
error_page 413 /.cloudbalancer/errors/413.html;
error_page 414 /.cloudbalancer/errors/414.html;
error_page 429 /.cloudbalancer/errors/429.html;
# Oversized headers. Nginx's internal 494 is never a real status code, so it
# is answered as the 400 it would have sent anyway.
error_page 494 =400 /.cloudbalancer/errors/494.html;
error_page 500 /.cloudbalancer/errors/500.html;
error_page 502 /.cloudbalancer/errors/502.html;
error_page 503 /.cloudbalancer/errors/503.html;
error_page 504 /.cloudbalancer/errors/504.html;

# ^~ so no regex location -- a generated `location ~ \.html$`, say -- can
# claim these paths first. Internal, so it cannot be requested directly.
location ^~ /.cloudbalancer/errors/ {
    internal;
    alias /usr/share/nginx/cloudbalancer-errors/;

    # Fills in the host and request ID. echo entity-encodes by default, so a
    # hostile Host header is printed, not interpreted.
    ssi on;

    # No add_header here, on purpose. One would replace every add_header the
    # server block sets -- HSTS on a TLS site, the panel's CSP -- and an error
    # response is exactly when those must still be sent. The page itself
    # needs nothing they forbid: its only style is inline, which the panel's
    # CSP allows, and it loads nothing else.
}
