# =============================================================================
# CloudBalancer
#
#   nginx     the data plane. The only container on the request path.
#   django    the control plane: renders config, issues certificates, serves
#             the API the panel reads.
#   celery    everything that must not block a request -- deploys, health
#             probes, ACME.
#
# The two planes share four mounts, which is the whole integration surface:
#   conf.d          django writes, nginx reads
#   acme_challenge  certbot writes, nginx serves
#   letsencrypt     certbot writes, nginx reads
#   nginx_cache     nginx writes, django purges from
# =============================================================================

# Set explicitly rather than derived from the directory name: the project
# name prefixes every volume, so leaving it implicit would make the data
# depend on what the checkout happens to be called.
name: cloudbalancer

# The json-file driver keeps everything forever unless told otherwise. On a
# box whose job is to stay up, a log file is not worth an outage.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-management: &management
  logging: *logging
  image: ${REGISTRY:-ghcr.io/shuv-o}/cloudbalancer-management:${IMAGE_TAG:-local}
  build:
    context: ./management
    dockerfile: Dockerfile
  env_file: [.env]
  volumes:
    - ./management:/app
    - ./gateway/nginx/conf.d:/etc/nginx/conf.d
    - acme_challenge:/var/www/acme
    - letsencrypt:/etc/letsencrypt
    - letsencrypt_work:/var/lib/letsencrypt
    - letsencrypt_log:/var/log/letsencrypt
    - nginx_cache:/var/cache/nginx
    - ssl_certs:/etc/nginx/ssl
    # Named by default so a backup survives `docker compose down -v`'s
    # siblings, but meant to be pointed at a real path on the host: a backup
    # on the same disk as the database protects against mistakes, not against
    # the disk. BACKUP_HOST_DIR in .env overrides it.
    - ${BACKUP_HOST_DIR:-backups}:/var/backups/cloudbalancer
    # Replaces the Docker socket. The panel writes a request here; a watcher
    # in the Nginx container runs nginx -t or nginx -s reload and writes the
    # answer back. Two commands instead of the whole Docker API.
    - nginx_control:/var/run/cloudbalancer
    # Read-only: the control plane reads these to build traffic analytics and
    # has no business writing to them. Nginx's own counters cannot answer who
    # a request came from or what it asked for; only the access log can.
    - nginx_logs:/var/log/nginx:ro
    # The geolocation databases, fetched by `manage.py geoip_update`. Not in
    # the image: they are licensed, they go stale monthly, and a copy baked in
    # is wrong within weeks.
    - geoip:/var/lib/cloudbalancer/geoip
  # Runs as a normal user. Nothing in the management plane needs root: it
  # renders templates, talks to Postgres and certbot, and writes to volumes
  # this compose file gives it.
  user: "10001:10001"
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [gateway]

services:
  # ---------------------------------------------------------------------------
  # Data plane
  # ---------------------------------------------------------------------------
  nginx:
    image: ${REGISTRY:-ghcr.io/shuv-o}/cloudbalancer-nginx:${IMAGE_TAG:-local}
    build:
      context: ./gateway/nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.6}
    container_name: cloudbalancer-nginx
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    # No cap_drop here, and that is a decision rather than an oversight.
    #
    # It was dropped to ALL with five added back. CI builds this image and
    # runs `nginx -t` against a rendered configuration, but `docker run` uses
    # the default capability set -- so the restricted one was never executed
    # anywhere before it reached a gateway carrying real traffic, where it
    # restart-looped. nginx's master does a lot as root: binds two privileged
    # ports, raises RLIMIT_NOFILE to 65536, writes a pid file, opens logs,
    # chowns the cache, and changes identity for every worker. Enumerating
    # that correctly from memory is what I tried and got wrong.
    #
    # The management plane is where the exposure actually is -- it renders
    # templates, parses certificates, talks to a CA, and had the Docker
    # socket until last week -- and it runs as uid 10001 with every
    # capability dropped. Taking the same from nginx was worth little and
    # cost the data plane.
    #
    # Re-adding it needs a test that starts this container with the
    # restriction and watches it serve a request, not a config check.
    ports:
      - "80:80"
      - "443:443"
      # The control panel. Bound to loopback by default: it is an admin surface
      # and does not belong on a public interface. Change PANEL_BIND to expose
      # it on a LAN address.
      - "${PANEL_BIND:-127.0.0.1}:8081:8081"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/nginx/conf.d:/etc/nginx/conf.d
      - panel_dist:/usr/share/nginx/panel:ro
      - nginx_cache:/var/cache/nginx
      - acme_challenge:/var/www/acme:ro
      - letsencrypt:/etc/letsencrypt:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      # Client-certificate CA for the control panel, when one is configured.
      # A bind mount so the bundle can be dropped in without a rebuild.
      - ./gateway/nginx/client-ca:/etc/nginx/client-ca:ro
      # Where the control plane asks for a config test or a reload. Writable
      # from both sides: the panel writes requests, the watcher writes answers.
      - nginx_control:/var/run/cloudbalancer
    environment:
      # Rotation, performed by the reload watcher. It holds the only
      # read-write mount of the log volume, and rotating from here means a
      # control plane that is down or wedged cannot let a disk fill.
      CLOUDBALANCER_LOG_ROTATE_BYTES: ${NGINX_LOG_ROTATE_BYTES:-67108864}
      CLOUDBALANCER_LOG_KEEP: ${NGINX_LOG_KEEP:-14}
      CLOUDBALANCER_LOG_CHECK_SECONDS: ${NGINX_LOG_CHECK_SECONDS:-60}
      CLOUDBALANCER_LOG_MIN_INTERVAL_SECONDS: ${NGINX_LOG_MIN_INTERVAL_SECONDS:-900}
      CLOUDBALANCER_LOG_MAX_AGE_MINUTES: ${NGINX_LOG_MAX_AGE_MINUTES:-1440}
    depends_on:
      # service_started, not service_healthy, and deliberately. Proxied traffic
      # does not involve the control plane, so a sick Django must not stop the
      # gateway from serving. The panel returns 503 until Django answers; every
      # other domain is unaffected.
      django:
        condition: service_started
      panel:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [gateway]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Proxying tens of thousands of concurrent connections needs more file
    # descriptors than the Docker default of 1024.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      # A SYN flood is answered by the kernel before Nginx is involved at all.
      # SYN cookies let it keep accepting legitimate connections while the
      # half-open table is full, which is the whole point of the attack.
      net.ipv4.tcp_syncookies: 1
      net.ipv4.tcp_max_syn_backlog: 8192
      net.core.somaxconn: 8192
      # Reclaim half-open connections faster, so holding them open is cheaper
      # to defend than to mount.
      net.ipv4.tcp_synack_retries: 2
      net.ipv4.tcp_fin_timeout: 15

  # ---------------------------------------------------------------------------
  # Control plane
  # ---------------------------------------------------------------------------
  django:
    <<: *management
    container_name: cloudbalancer-django
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    # A script, not an inline chain. See management/docker-entrypoint.sh for
    # why: a multi-line command here silently became several commands.
    command: ["./docker-entrypoint.sh"]
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # Any HTTP response means the stack from socket to middleware is up. A
      # 403 from the address allowlist still proves Django is answering, so the
      # check deliberately accepts it.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,urllib.error,sys;
          req=urllib.request.Request('http://127.0.0.1:8000/api/v1/auth/me/');
          exec('try:\n urllib.request.urlopen(req,timeout=5)\nexcept urllib.error.HTTPError:\n pass\nexcept Exception:\n sys.exit(1)')"
      interval: 10s
      timeout: 6s
      retries: 3
      # Generous: the first boot of an empty database applies every migration
      # before gunicorn binds.
      start_period: 120s

  celery:
    <<: *management
    container_name: cloudbalancer-celery
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    command: celery -A config worker -l info -c 4
    depends_on:
      django: {condition: service_started}
      redis: {condition: service_healthy}

  celery-beat:
    <<: *management
    container_name: cloudbalancer-celery-beat
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    command: >
      celery -A config beat -l info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      django: {condition: service_started}
      redis: {condition: service_healthy}

  # ---------------------------------------------------------------------------
  # Control panel — builds the bundle, drops it in a volume, exits.
  # ---------------------------------------------------------------------------
  panel:
    image: ${REGISTRY:-ghcr.io/shuv-o}/cloudbalancer-panel:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbalancer-panel-build
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    volumes:
      - panel_dist:/out
    command: sh -c "rm -rf /out/* && cp -r /app/dist/. /out/ && echo 'Control panel built.'"
    networks: [gateway]

  # ---------------------------------------------------------------------------
  # Stores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    container_name: cloudbalancer-postgres
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudbalancer}
      POSTGRES_USER: ${POSTGRES_USER:-cloudbalancer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudbalancer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [gateway]

  redis:
    image: redis:7-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Redis starts as root, chowns /data, then calls setpriv to drop to the
    # redis user. With every capability dropped it cannot do either, and the
    # container comes up unhealthy with nothing in its log that names the
    # cause. These five are what that sequence needs; everything genuinely
    # dangerous -- NET_RAW, NET_ADMIN, SYS_PTRACE, MKNOD -- stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    container_name: cloudbalancer-redis
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    command: >-
      redis-server --save 60 1 --appendonly no
      --maxmemory 320mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [gateway]

  # ---------------------------------------------------------------------------
  # Observability
  #
  # Prometheus scrapes Nginx directly: the traffic-status module serves its own
  # Prometheus endpoint, so there is no exporter sidecar to run or to fall
  # behind. That endpoint is also the only source of cache hit ratio.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    labels:
      # The image sets USER itself, so nothing changes identity at runtime
      # and dropping every capability costs it nothing. Stated rather than
      # assumed: the alternative is pinning a uid here and guessing wrong,
      # which is how a volume stops being writable on an image upgrade.
      cloudbalancer.unprivileged-image: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    container_name: cloudbalancer-prometheus
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # prometheus.yml has referenced /etc/prometheus/rules/*.yml since
      # this stack was written. Nothing mounted it, so the glob matched
      # nothing and no rule has ever fired -- which looks exactly like a
      # system with no problems.
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A year of history, with a month of margin. The panel offers a 1-year
      # range; retaining exactly 365d would mean the far edge of that range was
      # being trimmed while someone looked at it.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-400d}
      # A ceiling, not a target. Whichever limit is reached first wins, so this
      # is set well above the estimate (roughly 5-6 MB per series per year at a
      # 10s scrape) to stop a runaway label from filling the disk -- not to
      # trim history. Raise it before shortening the retention above.
      - --storage.tsdb.retention.size=${PROMETHEUS_MAX_DISK:-24GB}
      - --web.enable-lifecycle
    expose: ["9090"]
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:9090:9090"
    restart: unless-stopped
    networks: [gateway]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    labels:
      # The image sets USER itself, so nothing changes identity at runtime
      # and dropping every capability costs it nothing. Stated rather than
      # assumed: the alternative is pinning a uid here and guessing wrong,
      # which is how a volume stops being writable on an image upgrade.
      cloudbalancer.unprivileged-image: "true"
    container_name: cloudbalancer-alertmanager
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # The shared secret the control plane checks, written from the
    # environment rather than into the config file, so rotating it does not
    # mean editing something that is in git.
    #
    # $$ so the shell expands it, not Compose: a Compose substitution bakes
    # the secret into the container's command, where `docker inspect` shows
    # it to anyone who can reach the daemon.
    #
    # Into /alertmanager, the data volume, which the image creates owned by
    # the unprivileged user it runs as. /etc/alertmanager is the image's own
    # directory and not somewhere a process running as nobody should expect
    # to write.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '%s' "$${ALERTMANAGER_WEBHOOK_SECRET:-}" > /alertmanager/webhook-secret
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    expose: ["9093"]
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:9093:9093"
    env_file: [.env]
    restart: unless-stopped
    networks: [gateway]

  grafana:
    image: grafana/grafana:11.5.1
    labels:
      # The image sets USER itself, so nothing changes identity at runtime
      # and dropping every capability costs it nothing. Stated rather than
      # assumed: the alternative is pinning a uid here and guessing wrong,
      # which is how a volume stops being writable on an image upgrade.
      cloudbalancer.unprivileged-image: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    container_name: cloudbalancer-grafana
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Allows the control panel to embed panels in an iframe.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      prometheus: {condition: service_started}
    restart: unless-stopped
    networks: [gateway]

volumes:
  alertmanager_data:
  geoip:
  backups:
  nginx_control:
  postgres_data:
  redis_data:
  nginx_cache:
  nginx_logs:
  ssl_certs:
  acme_challenge:
  letsencrypt:
  letsencrypt_work:
  letsencrypt_log:
  panel_dist:
  prometheus_data:
  grafana_data:

networks:
  gateway:
    driver: bridge
