# =============================================================================
# The catch-all server, and the control panel.
#
# This file is not generated. The control plane only ever rewrites 00-maps,
# 10-upstreams and 20-servers, so anything hand-written here survives a deploy.
# =============================================================================

# No `upstream` block for the control plane, deliberately.
#
# Nginx resolves the hosts in one when it loads its configuration and refuses
# to start if a name does not resolve. With django named here, a control plane
# that was down stopped the gateway from starting -- taking every domain it
# serves with it. $management_api is defined in nginx.conf and resolved per
# request instead.
#
# The cost is the keepalive pool this block used to provide. The panel is an
# administrative interface carrying a handful of requests per minute, so a
# connection setup per request is not a cost worth an outage.

# -----------------------------------------------------------------------------
# Port 443, any hostname this gateway does not serve.
#
# Without this block there is no default server for 443, so Nginx uses the
# first one that happens to listen there. conf.d loads alphabetically, which
# makes that 05-panel.conf -- so every unconfigured HTTPS hostname pointing at
# this address was answered with the control panel. Django refused the API
# calls through ALLOWED_HOSTS, but the admin interface was being served on
# names it has nothing to do with.
#
# ssl_reject_handshake refuses the TLS handshake itself, which is why this
# block needs no certificate: there is nothing to present and nothing to
# serve. A client asking for a name this gateway does not know gets a TLS
# error, which is the honest answer and the same one it would get from an
# address that answers nothing at all.
#
# No reuseport here: port 80's catch-all already claims it for this worker
# set, and a second claim on the same address is a startup error.
# -----------------------------------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

# -----------------------------------------------------------------------------
# Port 80, any host that matches no configured domain.
#
# It answers ACME challenges -- so a certificate can be issued for a domain
# whose server block does not exist yet -- and otherwise says nothing useful.
# A gateway should not advertise what it is to an unconfigured caller.
# -----------------------------------------------------------------------------
server {
    listen 80 default_server reuseport;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":"No domain is configured for this host."}';
    }
}

# -----------------------------------------------------------------------------
# The control panel, on its own port.
#
# Deliberately not on 80 or 443: the gateway's public listeners answer for
# whatever domains an operator configures, and the panel should never be one
# host header away from the internet. Reach it over the LAN or a VPN, or put a
# configured domain in front of it with authentication of your own.
# -----------------------------------------------------------------------------
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log /var/log/nginx/panel.access.log main buffer=32k flush=5s;

    # The panel's own bundle and its self-hosted fonts. Both are content-hashed
    # at build time, so they can be cached hard.
    location ~ ^/(assets|fonts)/ {
        root /usr/share/nginx/panel;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://$management_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Certificate issuance waits on a remote CA, and config previews
        # render every server block. Neither is a two-second request.
        proxy_read_timeout 120s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @management_api_down;
    }

    # A bare 502 here says only "something upstream is unwell", which on a
    # first deploy is indistinguishable from a broken install. Django spends a
    # minute migrating before gunicorn binds, so the common case is simply
    # "not yet" -- and the response should say so.
    location @management_api_down {
        default_type application/json;
        return 503 '{"error":"The management API is not responding.","hint":"It may still be starting: migrations run before it binds. Check with: docker compose ps django && docker compose logs --tail 50 django"}';
    }


    location /admin/ {
        proxy_pass http://$management_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://$management_api;
        proxy_set_header Host $host;
        expires 1h;
    }

    # Single-page app: every other path renders the panel and lets the router
    # resolve it.
    location / {
        root /usr/share/nginx/panel;
        try_files $uri $uri/ /index.html;
    }
}
