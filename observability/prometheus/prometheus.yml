# =============================================================================
# Prometheus scrape configuration.
#
# Nginx is scraped directly. The traffic-status module serves its own
# Prometheus endpoint, so there is no exporter process to run, to keep in sync,
# or to fall behind under load -- and it is the only source in this stack for
# cache hit ratio and per-vhost breakdowns.
# =============================================================================
global:
  scrape_interval: 10s
  evaluation_interval: 30s
  external_labels:
    stack: cloudbalancer

rule_files:
  - /etc/prometheus/rules/*.yml

# Where a firing rule goes. Without this block Prometheus evaluates every rule
# faithfully, marks them firing in its own UI, and tells nobody.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nginx-gateway
    metrics_path: /status/format/prometheus
    static_configs:
      - targets: ["nginx:8080"]
        labels:
          component: data-plane

  - job_name: django-management
    metrics_path: /metrics
    # Three times the global interval. The control plane exports by far the
    # most series here, and at a year of retention that cost is paid 3.15
    # million times per series. Nothing on this job is read at finer than a
    # two-minute rate window, so the resolution is not being used.
    scrape_interval: 30s
    static_configs:
      - targets: ["django:8000"]
        labels:
          component: control-plane

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
