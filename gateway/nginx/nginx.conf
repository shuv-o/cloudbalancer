# =============================================================================
# Gateway data plane.
#
# Everything here is on the hot path, so the tuning below is chosen for added
# latency rather than for feature coverage. The parts that matter most:
#
#   * upstream keepalive, set up here and sized per backend in the generated
#     upstream blocks -- without it every proxied request pays a TCP handshake
#   * buffered access logs -- an unbuffered write per request is a real and
#     commonly missed contributor to tail latency
#   * no regex locations in the generated config unless a rule asks for one
# =============================================================================

load_module modules/ngx_http_vhost_traffic_status_module.so;

user  nginx;
worker_processes  auto;
worker_cpu_affinity auto;
worker_rlimit_nofile  65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    #
    # $request_time minus $upstream_response_time is the gateway's own added
    # latency, measured per request with no load generator involved. It is the
    # cheapest and most trustworthy way to answer "how much does the proxy
    # cost", which is why every field needed for it is logged.
    #
    # $upstream_connect_time near zero confirms the keepalive pool is working.
    # If it is non-zero on most requests, the pool is undersized and every
    # request is paying for a fresh TCP connection.
    # -------------------------------------------------------------------------
    log_format  main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'rid=$request_id '
        'cache=$upstream_cache_status '
        'rt=$request_time uct=$upstream_connect_time '
        'uht=$upstream_header_time urt=$upstream_response_time '
        'upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;

    # -------------------------------------------------------------------------
    # Traffic accounting, scraped by Prometheus straight off Nginx.
    # -------------------------------------------------------------------------
    vhost_traffic_status_zone shared:vhost_traffic_status:32m;

    # Latency buckets, which turn the traffic module's timings into a real
    # distribution rather than a mean.
    #
    # A mean response time is the least useful number a gateway produces: it
    # hides the tail completely. Ten thousand requests at 5ms and a hundred
    # at nine seconds average out to something that looks healthy, and the
    # hundred are the ones somebody is complaining about.
    #
    # These are the boundaries Prometheus counts into. They are spaced by
    # what the number means rather than evenly: sub-10ms is cache and
    # keepalive working, 100ms is a backend thinking, and anything past a
    # second is a person waiting. Each bucket is a label value per vhost, so
    # the count is kept small deliberately -- this is seven, not twenty.
    vhost_traffic_status_histogram_buckets 0.005 0.01 0.05 0.1 0.5 1 5;

    # -------------------------------------------------------------------------
    # Transfer tuning
    # -------------------------------------------------------------------------
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    75s;
    keepalive_requests   10000;
    reset_timedout_connection on;

    # Slow-request defences. Holding thousands of connections open while
    # trickling a request costs an attacker almost nothing and exhausts a
    # worker pool, so these are deliberately short. A legitimate client on a
    # bad connection retries; one holding a socket open on purpose does not.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          20s;
    types_hash_max_size  2048;
    server_tokens        off;

    # Sized so ordinary request lines and header sets never spill to a second
    # allocation on the hot path.
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_max_body_size        64m;

    # -------------------------------------------------------------------------
    # Compression
    #
    # Applied to proxied responses too, but never to already-compressed types.
    # -------------------------------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  4;
    gzip_min_length  512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # HTTP cache
    #
    #   keys_zone  64 MB of shared memory, roughly 500k entries
    #   max_size   2 GB on disk
    #   inactive   entries untouched for a day are evicted regardless of TTL
    #   levels=1:2 the directory layout the control panel derives purge paths
    #              from, so a single URL can be dropped without the commercial
    #              purge module
    # -------------------------------------------------------------------------
    proxy_cache_path  /var/cache/nginx
                      levels=1:2
                      keys_zone=gateway_cache:64m
                      max_size=2g
                      inactive=24h
                      use_temp_path=off;

    # Nginx honours Vary on its own, keeping one cached variant per value.
    # It is deliberately NOT ignored here: ignoring it would cache a single
    # variant and hand it to every client regardless of what they asked for.

    # -------------------------------------------------------------------------
    # The control plane's address, resolved per request rather than at startup.
    #
    # This used to be an `upstream` block naming django:8000. Nginx resolves
    # the hosts in an upstream block when it loads its configuration, and
    # refuses to start if one does not resolve -- so whenever the control
    # plane was down, the gateway would not start either, and every domain it
    # serves went with it. That is the exact coupling the Compose file says it
    # avoids by depending on django with service_started rather than
    # service_healthy; the DNS lookup defeated the intent.
    #
    # Through a variable, Nginx resolves at request time instead. The control
    # plane being down is then a 503 on the panel, which is what it should
    # have been all along, rather than an outage of the data plane.
    #
    # 127.0.0.11 is Docker's embedded DNS. `valid` is short because a
    # container that restarts comes back on a different address, and ipv6 is
    # off because the embedded resolver answers AAAA with nothing useful and
    # Nginx would wait for it on every lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # A map purely to produce a constant-valued variable: proxy_pass only
    # defers resolution when its address contains one.
    map $host $management_api {
        default "django:8000";
    }

    # -------------------------------------------------------------------------
    # Upstream defaults. Per-route overrides are emitted by the control plane.
    # -------------------------------------------------------------------------
    proxy_http_version     1.1;
    proxy_set_header       Connection "";
    proxy_connect_timeout  3s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
    proxy_buffer_size      8k;
    proxy_buffers          16 8k;
    proxy_busy_buffers_size 16k;

    # Retry the next instance rather than returning the first failure. This is
    # the real failover path: it acts per request, in real time, which no
    # external health prober can match.
    proxy_next_upstream          error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries    2;
    proxy_next_upstream_timeout  5s;

    # -------------------------------------------------------------------------
    # Internal status endpoints. Not reachable from outside the Compose network.
    # -------------------------------------------------------------------------
    server {
        listen      8080;
        server_name _;
        access_log  off;

        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.1;
        deny   all;

        # JSON for the control panel, Prometheus text for the scraper.
        location /status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format html;
        }

        location /health {
            return 200 '{"status":"ok"}';
            default_type application/json;
        }
    }

    # -------------------------------------------------------------------------
    # Generated configuration, in load order:
    #   00-maps       http-context maps and rate-limit zones
    #   10-upstreams  one block per backend
    #   20-servers    one block per domain
    #   default       the catch-all and the control panel
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
