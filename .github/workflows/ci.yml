name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # The control plane. SQLite and an in-process cache stand in for Postgres and
  # Redis; nothing here touches a real gateway.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: management/requirements.lock

      - name: Install dependencies
        working-directory: management
        run: |
          python -m pip install --upgrade pip
          # The lock, with hashes, exactly as the image does. Testing against
          # resolved-today versions while shipping pinned ones means the suite
          # is not testing what gets deployed.
          pip install --require-hashes -r requirements.lock

      - name: Every runtime import resolves in a clean environment
        run: |
          # The test suite runs Celery eagerly and never loads the broker
          # transport, so an undeclared transitive dependency passes every
          # test and fails on the first write in production.
          python - <<'PY'
          import importlib, sys
          modules = [
              "kombu.transport.redis", "celery", "django_celery_beat",
              "django_redis.cache", "psycopg2", "cryptography.x509",
              "pyotp", "qrcode.image.svg", "httpx", "django_prometheus",
              "corsheaders", "jinja2", "certbot",
          ]
          missing = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  missing.append(f"{name}: {type(exc).__name__}: {exc}")
          if missing:
              for entry in missing:
                  print(f"::error::{entry}")
              sys.exit(1)
          print(f"All {len(modules)} runtime imports resolve.")
          PY

      - name: Check for missing migrations
        working-directory: management
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: management
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py test --verbosity 2

  # ---------------------------------------------------------------------------
  # The control panel.
  # ---------------------------------------------------------------------------
  frontend:
    name: Panel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit shipped dependencies
        working-directory: frontend
        run: |
          # Production dependencies only. A vulnerable build tool is worth
          # knowing about; a vulnerable package in the bundle an operator
          # loads is worth failing over.
          npm audit --omit=dev --audit-level=moderate

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Fail if the bundle loads a third-party origin
        working-directory: frontend
        run: |
          # The panel's content security policy is default-src 'none' with no
          # external origins. A dependency that quietly adds one would not fail
          # the build -- it would fail in a browser, on the admin surface, after
          # deployment.
          if grep -rIoE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|unpkg|jsdelivr)[^"'"'"' ]*' dist/ ; then
            echo "::error::The built panel references an external origin. The CSP will block it."
            exit 1
          fi
          echo "No third-party origins in the bundle."

  # ---------------------------------------------------------------------------
  # The gateway configuration, verified by an actual Nginx.
  #
  # Every other check in this repository asserts against strings, which catches
  # a missing directive but not one Nginx rejects. This renders a deliberately
  # awkward topology and hands the files to the real image, with the traffic
  # module compiled in -- the only place that check can happen.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Supply chain
  #
  # Two questions: does the lock still describe requirements.txt, and do the
  # images ship a known-vulnerable package. Both are things that become true
  # without anybody changing anything, which is why they are checked on every
  # run rather than when someone remembers.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tools
        run: pip install packaging pyyaml

      - name: The lock covers everything requirements.txt asks for
        working-directory: management
        run: |
          python - <<'PY'
          import re, sys
          from packaging.requirements import Requirement
          from packaging.version import Version

          # Deliberately not a re-resolution.
          #
          # The first version of this check ran pip-compile and diffed the
          # result against the committed lock. That fails whenever anything
          # upstream publishes a release -- the resolver picks the new version,
          # the diff is non-empty, and CI blocks a pull request that touched
          # none of it. A gate that fails for reasons outside the repository
          # gets switched off.
          #
          # What actually goes wrong is someone adding a dependency and not
          # regenerating. That is what this looks for, offline and
          # deterministically: every requirement named must be pinned in the
          # lock, at a version its specifier allows.
          pinned = {}
          for line in open("requirements.lock"):
              match = re.match(r"^([A-Za-z0-9._-]+)==([^\s\\;]+)", line)
              if match:
                  pinned[match.group(1).lower().replace("_", "-")] = match.group(2)

          problems = []
          declared = 0
          for raw in open("requirements.txt"):
              raw = raw.split("#")[0].strip()
              if not raw or raw.startswith("-"):
                  continue
              try:
                  requirement = Requirement(raw)
              except Exception:
                  problems.append(f"could not parse '{raw}' in requirements.txt")
                  continue

              declared += 1
              name = requirement.name.lower().replace("_", "-")
              if name not in pinned:
                  problems.append(
                      f"{requirement.name} is required but is not in the lock"
                  )
                  continue
              if not requirement.specifier.contains(Version(pinned[name]), prereleases=True):
                  problems.append(
                      f"{requirement.name} is pinned at {pinned[name]}, which "
                      f"'{requirement.specifier}' does not allow"
                  )

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              print("::error::Run `make lock` and commit the result.")
              sys.exit(1)

          print(f"{declared} declared requirements, all pinned in a lock of {len(pinned)}.")
          PY

      - name: Known vulnerabilities in the locked dependencies
        working-directory: management
        run: |
          pip install pip-audit
          # Reports, does not fail. A CVE published overnight in a transitive
          # dependency would otherwise block an unrelated deploy, and a gate
          # that blocks the wrong thing gets switched off.
          pip-audit --requirement requirements.lock --disable-pip || true

      - uses: docker/setup-buildx-action@v3

      - name: Build the management image
        uses: docker/build-push-action@v6
        with:
          context: ./management
          push: false
          load: true
          tags: cloudbalancer-management:scan

      - name: Scan it
        # Pinned to a commit rather than a tag. A tag can be moved to point at
        # different code, which in a job about supply chain would be an odd
        # thing to leave open.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: cloudbalancer-management:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: The management image runs as a normal user and has no Docker CLI
        run: |
          user=$(docker image inspect cloudbalancer-management:scan \
            --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ]; then
            echo "::error::the management image runs as root"
            exit 1
          fi
          echo "Runs as: $user"

          if docker run --rm --entrypoint sh cloudbalancer-management:scan \
               -c 'command -v docker' >/dev/null 2>&1; then
            echo "::error::the Docker CLI is back in the management image."
            echo "Its only use was reaching Nginx, which the control directory replaced."
            exit 1
          fi
          echo "No Docker CLI."

      - name: Every hardened service can still start
        run: |
          python - <<'PY'
          import sys, yaml

          # Dropping every capability from an image that drops privileges at
          # runtime produces a container that comes up unhealthy with nothing
          # in its log naming the cause. Redis shipped that way once: its
          # entrypoint starts as root, chowns /data and calls setpriv, all of
          # which need capabilities that had been taken away.
          #
          # The rule: a service that drops ALL must either run as a declared
          # user -- so nothing has to change identity at runtime -- or be
          # given back the capabilities that changing identity needs.
          NEEDED = {"SETUID", "SETGID"}

          compose = yaml.safe_load(open("docker-compose.yml"))
          problems = []

          for name, service in compose["services"].items():
              dropped = {c.upper() for c in (service.get("cap_drop") or [])}
              if "ALL" not in dropped:
                  continue

              added = {c.upper() for c in (service.get("cap_add") or [])}
              labels = service.get("labels") or {}

              if service.get("user"):
                  continue
              if str(labels.get("cloudbalancer.unprivileged-image", "")).lower() == "true":
                  # The image sets USER itself. Declared on the service so a
                  # reader can see why dropping everything is safe here, and
                  # so the claim is somewhere it can be rechecked on an
                  # image upgrade.
                  continue
              if NEEDED <= added:
                  continue

              problems.append(
                  f"{name}: drops ALL capabilities, declares no user, and "
                  f"is not given back {sorted(NEEDED - added)}. Either add "
                  f"them, set `user:`, or -- if the image already sets USER "
                  f"itself -- label it cloudbalancer.unprivileged-image: "
                  f'"true" so the claim is written down.'
              )

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"Checked {len(compose['services'])} services.")
          PY

      - name: Nothing mounts the Docker socket
        run: |
          if grep -n 'docker\.sock' docker-compose.yml; then
            echo "::error::a service mounts /var/run/docker.sock."
            echo "That is the unauthenticated Docker API, and therefore root on the host."
            exit 1
          fi
          echo "No Docker socket mounts."

  gateway-config:
    name: Nginx accepts the generated config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: management/requirements.lock

      - name: Install dependencies
        working-directory: management
        run: pip install --require-hashes -r requirements.lock

      # The default docker driver cannot export a build cache. Without this
      # the build fails on cache-to rather than on anything to do with the
      # image.
      - uses: docker/setup-buildx-action@v3

      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway/nginx
          load: true
          tags: cloudbalancer-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the gateway image
        # The component that faces the internet, scanned here because this
        # job already has it built. Reports rather than blocks, for the same
        # reason the other scan does: a CVE published overnight in a base
        # image should not stop an unrelated deploy.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: cloudbalancer-nginx:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Render a representative configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SQLITE_PATH: ${{ runner.temp }}/ci.sqlite3
          NGINX_CONF_DIR: ${{ runner.temp }}/conf.d
          NGINX_SSL_DIR: ${{ runner.temp }}/ssl
          ACME_WEBROOT_DIR: ${{ runner.temp }}/acme
        run: |
          mkdir -p "$NGINX_CONF_DIR" "$NGINX_SSL_DIR" "$ACME_WEBROOT_DIR"
          python management/manage.py migrate --noinput
          python deploy/ci_fixture.py "$NGINX_CONF_DIR"
          cp gateway/nginx/conf.d/default.conf "$NGINX_CONF_DIR/"

      - name: Every file the config references exists
        run: |
          # Nginx reports a missing certificate as a failure to open a path,
          # without saying that the path was never the one you configured.
          # Checking here names the file and the directive instead.
          python - "${{ runner.temp }}/conf.d" <<'PY'
          import re, sys
          from pathlib import Path

          conf_dir = Path(sys.argv[1])
          directives = ("ssl_certificate", "ssl_certificate_key",
                        "ssl_client_certificate", "ssl_trusted_certificate")
          missing = []
          checked = 0
          for conf in sorted(conf_dir.glob("*.conf")):
              for line in conf.read_text().splitlines():
                  s = line.strip()
                  if s.startswith("#"):
                      continue
                  m = re.match(rf"({'|'.join(directives)})\s+(\S+);", s)
                  if not m:
                      continue
                  checked += 1
                  if not Path(m.group(2)).is_file():
                      missing.append(f"{conf.name}: {m.group(1)} -> {m.group(2)}")

          if missing:
              print("::error::Config references files that do not exist:")
              for entry in missing:
                  print(f"  {entry}")
              sys.exit(1)
          print(f"All {checked} referenced certificate files exist.")
          PY

      - name: An unconfigured hostname does not reach the control panel
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # conf.d loads alphabetically, so without an explicit default_server
          # on 443 the first block that listens there becomes the default --
          # and that is 05-panel.conf. Every unconfigured HTTPS hostname
          # pointing at the gateway was being answered with the admin panel.
          conf = pathlib.Path("${{ runner.temp }}/conf.d")
          defaults = []
          for path in sorted(conf.glob("*.conf")):
              text = path.read_text()
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("listen") and "default_server" in stripped:
                      if re.search(r"\b443\b", stripped):
                          defaults.append((path.name, stripped))

          if not defaults:
              print("::error::no server block claims default_server on 443.")
              print("::error::Nginx then picks the first 443 listener, which is the panel.")
              sys.exit(1)

          owners = {name for name, _ in defaults}
          if owners != {"default.conf"}:
              for name, line in defaults:
                  print(f"::error::{name} claims the 443 default server: {line}")
              print("::error::It belongs to default.conf, which rejects unknown names.")
              sys.exit(1)

          if "ssl_reject_handshake on;" not in (conf / "default.conf").read_text():
              print("::error::the 443 default server does not reject the handshake,")
              print("::error::so it will serve something to a hostname nobody configured.")
              sys.exit(1)

          print(f"443 default server is default.conf, and rejects: {len(defaults)} listen lines.")
          PY

      - name: nginx -t
        run: |
          # The --add-host is now belt and braces: the management address
          # goes through a resolver variable, so nothing here needs django to
          # exist. It stays because a generated config could name a backend
          # host, and that failing would be a real finding reported as a
          # confusing one.
          docker run --rm \
            --add-host django:127.0.0.1 \
            -v "${{ runner.temp }}/conf.d:/etc/nginx/conf.d:ro" \
            -v "${{ runner.temp }}/ssl:${{ runner.temp }}/ssl:ro" \
            -v "$PWD/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            cloudbalancer-nginx:ci nginx -t

      - name: It also starts, under the options it is deployed with
        run: |
          # `nginx -t` loads the configuration and exits. It does not run the
          # entrypoint scripts to completion, bind a port, raise a file-
          # descriptor limit, write a pid file, or fork a worker -- and every
          # one of those is something a container option can forbid.
          #
          # A capability restriction that passed `nginx -t` here and
          # restart-looped on a gateway is why this exists. Whatever options
          # docker-compose.yml gives this service, they are applied here, so
          # the next one fails on a runner instead.
          pip install --quiet pyyaml
          python - <<'PY' > /tmp/nginx-opts
          import shlex, yaml

          service = yaml.safe_load(open("docker-compose.yml"))["services"]["nginx"]
          args = []
          for option in service.get("security_opt") or []:
              args += ["--security-opt", option]
          for capability in service.get("cap_drop") or []:
              args += ["--cap-drop", capability]
          for capability in service.get("cap_add") or []:
              args += ["--cap-add", capability]
          if service.get("user"):
              args += ["--user", str(service["user"])]
          print(" ".join(shlex.quote(a) for a in args))
          PY
          opts=$(cat /tmp/nginx-opts)
          echo "Starting with: ${opts:-(no extra options)}"

          # Deliberately no --add-host django. The gateway went down because
          # it could not resolve the control plane at startup, so the thing
          # worth proving is that it starts when the control plane does not
          # exist at all.
          docker run -d --name nginx-smoke \
            -v "${{ runner.temp }}/conf.d:/etc/nginx/conf.d:ro" \
            -v "${{ runner.temp }}/ssl:${{ runner.temp }}/ssl:ro" \
            -v "$PWD/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -p 18080:8080 \
            $opts \
            cloudbalancer-nginx:ci

          for attempt in $(seq 1 20); do
            # The status listener, which proves a worker forked and is
            # answering rather than that the master merely parsed a file.
            if curl -fsS -o /dev/null http://127.0.0.1:18080/health; then
              echo "Serving after ${attempt}s."
              docker rm -f nginx-smoke >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' nginx-smoke)" != "true" ]; then
              echo "::error::nginx exited $(docker inspect -f '{{.State.ExitCode}}' nginx-smoke)"
              docker logs nginx-smoke
              exit 1
            fi
            sleep 1
          done

          echo "::error::nginx started but never answered on its status port."
          docker logs nginx-smoke
          exit 1

      - name: Show what was verified
        if: always()
        run: |
          echo "### Configuration verified by Nginx" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          wc -l "${{ runner.temp }}"/conf.d/*.conf >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Compose and shell scripts.
  # ---------------------------------------------------------------------------
  static:
    name: Compose and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose files
        run: |
          # .env is not in the repository, so compose has nothing to interpolate
          # the required variables from. The example file stands in, which also
          # checks it is complete enough to bring the stack up.
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.bench.yml config --quiet
          rm .env
          echo "Compose files are valid using .env.example alone."

      - name: No service command contains a newline
        run: |
          # A YAML folded scalar (>) folds only the lines at the first line's
          # indentation. Continuation lines indented further keep their
          # newlines, and the shell then reads one command as several. That
          # turned `gunicorn --bind 0.0.0.0:8000` into a bare `gunicorn`
          # listening on loopback, unreachable from any other container, while
          # the logs showed a clean start.
          cp .env.example .env
          docker compose config > /tmp/resolved.yml
          rm .env
          python - <<'PY'
          import sys, yaml
          services = yaml.safe_load(open("/tmp/resolved.yml"))["services"]
          broken = []
          for name, svc in services.items():
              cmd = svc.get("command")
              if not cmd:
                  continue
              text = cmd if isinstance(cmd, str) else " ".join(map(str, cmd))
              if "\n" in text:
                  broken.append((name, text))
          if broken:
              for name, text in broken:
                  print(f"::error::service '{name}' has a multi-line command; "
                        "the shell will read it as several commands")
                  for line in text.split("\n"):
                      print(f"    | {line.strip()}")
              sys.exit(1)
          print(f"All {len(services)} service commands are single-line.")
          PY

      - name: Every Makefile target is phony
        run: |
          # Make treats a target whose name matches an existing file or
          # directory as already up to date. `deploy/` is a directory, so
          # `make deploy` printed "'deploy' is up to date" and ran nothing --
          # config changes sat in the database while Nginx served the old file.
          python - <<'PY'
          import re, sys
          text = open("Makefile").read()
          targets = []
          for t in re.findall(r"^([a-z][a-z0-9-]*):", text, re.M):
              if t not in targets:
                  targets.append(t)
          phony = set()
          for block in re.findall(r"^\.PHONY:((?:[^\n\\]*\\\n)*[^\n]*)", text, re.M):
              phony.update(block.replace("\\", " ").split())
          missing = [t for t in targets if t not in phony]
          if missing:
              for t in missing:
                  print(f"::error::Makefile target '{t}' is not in .PHONY")
              sys.exit(1)
          print(f"All {len(targets)} Makefile targets are declared .PHONY.")
          PY

      - name: Check shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are resolved at runtime, not here.
          shellcheck -e SC1091 benchmarks/*.sh deploy/*.sh

      - name: Fail if generated config is tracked
        run: |
          # A generated file in the repository is written over the server's own
          # copy by the deploy checkout, replacing live configuration with
          # whatever a developer happened to render.
          managed=$(grep -oE '"[0-9]{2}-[a-z]+\.conf"' \
            management/apps/gateway/services.py | tr -d '"' | sort -u)
          failed=0
          for f in $managed; do
            if git ls-files --error-unmatch "gateway/nginx/conf.d/$f" >/dev/null 2>&1; then
              echo "::error::gateway/nginx/conf.d/$f is generated but tracked in git."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "No generated config tracked: $(echo "$managed" | tr '\n' ' ')"
          exit "$failed"

      - name: Fail if a secret was committed
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::.env is tracked. It holds credentials and must not be committed."
            exit 1
          fi
          if git ls-files | grep -qE '\.(key|p12|pem)$' | grep -v example; then
            echo "::error::Key material is tracked."
            exit 1
          fi
          echo "No secrets tracked."
